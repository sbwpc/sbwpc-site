# Netlify builds the Astro site in /web. Content comes from Sanity when
# SANITY_PROJECT_ID is set in the Netlify environment, otherwise from /seed.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Build when the site code (web/) or the seed content (seed/) changes.
  # Without this, Netlify skips builds that only touch seed/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../seed ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Member admin: never cached, never framed, and only allowed to talk to our own database
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://rbvhmrsepsategvrmqcv.supabase.co wss://rbvhmrsepsategvrmqcv.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# Apple Pay checks this file to confirm the site may show Apple Pay. The file itself comes from PayPal.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"
